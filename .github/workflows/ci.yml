name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:frontend:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 30

      - name: Upload frontend test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: frontend-test-results
          path: test-results/
          retention-days: 30

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check formatting
        run: ./gradlew formatCheck

      - name: Lint
        run: ./gradlew lint

      - name: Test with coverage
        run: ./gradlew test jacocoTestReport

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/
          retention-days: 30

      - name: Upload backend test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/build/test-results/
          retention-days: 30

      - name: Build
        run: ./gradlew build -x test

  seeder:
    name: Seeder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_DB: ${{ github.workspace }}/seed-smoke.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The oldest Python the README supports.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          .venv/bin/python -m pip install -r scripts/requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check scripts/

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s scripts/tests -v

      - name: Seed an empty database
        env:
          TELECOM_JDBC_URL: jdbc:sqlite:${{ env.SMOKE_DB }}?foreign_keys=true&date_class=INTEGER&date_precision=MILLISECONDS
          TELECOM_DB_PATH: ${{ env.SMOKE_DB }}
        run: |
          (cd backend && ./gradlew --console=plain migrateDatabase)
          .venv/bin/python scripts/seed-database.py
          # A second run must leave the seeded data alone.
          .venv/bin/python scripts/seed-database.py > second-run.log
          cat second-run.log
          grep -q "leaving it unchanged" second-run.log

      - name: Check seeded row counts
        run: |
          .venv/bin/python - <<'PY'
          import os
          import sqlite3

          expected = {"plans": 8, "customers": 500, "devices": 600, "support_tickets": 250}
          with sqlite3.connect(os.environ["SMOKE_DB"]) as conn:
              counts = {
                  table: conn.execute(f"SELECT count(*) FROM {table}").fetchone()[0]
                  for table in [*expected, "usage_records"]
              }
              broken = conn.execute("PRAGMA foreign_key_check").fetchall()
          print(counts)
          errors = [f"{t}: expected {n}, got {counts[t]}" for t, n in expected.items() if counts[t] != n]
          if counts["usage_records"] == 0:
              errors.append("usage_records: expected rows, got 0")
          if broken:
              errors.append(f"foreign key violations: {broken[:5]}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Setup database
        run: |
          pnpm setup:python
          pnpm setup:db

      # Throwaway demo passwords for this run; the backend and the Playwright login read the same variables.
      - name: Generate demo login passwords
        run: |
          for name in DEMO_ADMIN_PASSWORD DEMO_AGENT_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BACKEND_URL: http://127.0.0.1:8080
          FRONTEND_URL: http://127.0.0.1:3000

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # The HTML and JUnit reports are separate Playwright outputs; failed tests also leave a trace.zip here.
      - name: Upload E2E test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 30
