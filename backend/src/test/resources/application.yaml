spring:
  application:
    name: telecom-backend
  datasource:
    url: "jdbc:sqlite:file:telecom-tests?mode=memory&cache=shared&foreign_keys=true&date_class=INTEGER&date_precision=MILLISECONDS"
    driver-class-name: org.sqlite.JDBC
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
